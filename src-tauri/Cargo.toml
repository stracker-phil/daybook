[package]
name = "daybook"
version = "0.1.0"
description = "A menu-bar companion for the day and the Obsidian vault"
authors = ["Philipp Stracker <info@philippstracker.com>"]
edition = "2024"
license = "MIT"

[lib]
name = "daybook_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
log = "0.4"
clap = { version = "4", features = ["derive"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net"] }
chrono = "0.4"
uuid = { version = "1", features = ["v4"] }
url = "2"
ts-rs = { version = "12", features = ["serde-compat", "serde-json-impl", "no-serde-warnings"] }
libc = "0.2"
tempfile = { version = "3", optional = true }
notify = "8"
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSGeometry"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "libc", "NSWorkspace", "NSRunningApplication"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFArray"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGWindow"] }
regex = "1"
# Pinned (Tauri pulls it in): the overlay's panel class repeats `TaoWindow`'s `focusable` ivar, which 0.37.2
# moved into a Rust struct. See docs/windows.md.
tao = { version = "=0.37.1", default-features = false }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
percent-encoding = "2"

[features]
# Exposes test helpers to integration tests in tests/.
test-util = ["dep:tempfile"]

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[dev-dependencies]
# Itself with test helpers, so integration tests in tests/ can use them (ADR 0006).
daybook = { path = ".", features = ["test-util"] }
tempfile = "3"
